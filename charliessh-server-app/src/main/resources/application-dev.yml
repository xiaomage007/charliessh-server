server:
  port: 8091

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 数据库配置；启动时配置数据库资源信息
spring:
  config:
    import:
      - optional:classpath:application-local.yml
      - classpath:agent/test-agent.yml
      - classpath:agent/parallel_research_app.yml
      - classpath:agent/only-one-agent.yml
  datasource:
    username: root
    password: ${DB_PASSWORD:${ai.local.datasource.password:}}
    url: jdbc:mysql://127.0.0.1:3306/charlie_scaffold?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=true
    driver-class-name: com.mysql.cj.jdbc.Driver
  hikari:
    pool-name: Retail_HikariCP
    minimum-idle: 15 #最小空闲连接数量
    idle-timeout: 180000 #空闲连接存活最大时间，默认600000（10分钟）
    maximum-pool-size: 25 #连接池最大连接数，默认是10
    auto-commit: true  #此属性控制从池返回的连接的默认自动提交行为,默认值：true
    max-lifetime: 1800000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
    connection-timeout: 30000 #数据库连接超时时间,默认30秒，即30000
    connection-test-query: SELECT 1
  type: com.zaxxer.hikari.HikariDataSource

# MyBatis 配置【如需使用记得打开】
# mybatis:
#  mapper-locations: classpath:/mybatis/mapper/*.xml
#  config-location:  classpath:/mybatis/config/mybatis-config.xml

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml

# AI 配置；密钥仅配置在本地，不要提交到仓库
ai:
  # 阶跃星辰；https://platform.stepfun.com
  stepfun:
    api-key: ${STEPFUN_API_KEY:${ai.local.stepfun.api-key:}}
  # 百度搜索 MCP；https://console.bce.baidu.com/iam/?_=1753597622044#/iam/apikey/list
  baidu:
    mcp:
      api-key: ${BAIDU_MCP_API_KEY:${ai.local.baidu.mcp.api-key:}}